<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #011a27;
          overflow: hidden;
          opacity: 0;
        }

        .stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          padding: 0 160px;
          gap: 100px;
        }

        /* ── glow behind the product ── */
        .glow {
          position: absolute;
          left: 120px;
          top: 50%;
          width: 900px;
          height: 900px;
          transform: translateY(-50%) scale(0.85);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(240, 129, 15, 0.55) 0%, rgba(240, 129, 15, 0) 68%);
          opacity: 0;
          z-index: 1;
        }

        /* ── product ── */
        .product-wrap {
          position: relative;
          z-index: 2;
          flex: 0 0 620px;
          display: flex;
          align-items: center;
          justify-content: center;
          transform: scale(0);
          opacity: 0;
        }
        .product-wrap img {
          width: 520px;
          height: auto;
          image-rendering: -webkit-optimize-contrast;
          filter: drop-shadow(0 40px 60px rgba(0, 0, 0, 0.55));
        }

        /* ── copy ── */
        .copy-col {
          position: relative;
          z-index: 2;
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 22px;
        }
        .eyebrow {
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          font-weight: 700;
          letter-spacing: 0.18em;
          color: #9f9c98;
          opacity: 0;
          transform: translateY(16px);
        }
        .name {
          font-family: "Archivo Black", sans-serif;
          font-size: 108px;
          line-height: 1.02;
          color: #ffffff;
          opacity: 0;
          transform: translateY(24px);
        }
        .subtitle {
          font-family: "Archivo Black", sans-serif;
          font-size: 36px;
          color: #9f9c98;
          opacity: 0;
          transform: translateY(16px);
        }

        .stat-row {
          display: flex;
          align-items: baseline;
          gap: 48px;
          margin-top: 24px;
        }
        .stat {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .stat-value-wrap {
          display: flex;
          align-items: baseline;
          width: 320px;
        }
        .stat-value {
          font-family: "JetBrains Mono", monospace;
          font-variant-numeric: tabular-nums;
          font-weight: 700;
          font-size: 88px;
          color: #f0810f;
          transform-origin: left center;
          transform: scale(0.55);
        }
        .stat-suffix {
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 44px;
          color: #f0810f;
          margin-left: 6px;
          opacity: 0;
          transform: translateY(14px);
        }
        .stat-label {
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #9f9c98;
        }
        .stat-divider {
          width: 3px;
          height: 70px;
          background: #063852;
          align-self: center;
        }

        /* ── brand mark, bottom-right ── */
        .logo-mark {
          position: absolute;
          right: 90px;
          bottom: 70px;
          width: 260px;
          z-index: 2;
          opacity: 0;
        }
        .logo-mark img {
          width: 100%;
          height: auto;
          display: block;
        }
      </style>

      <div id="root" data-composition-id="02-product-card" data-width="1920" data-height="1080">
        <div class="glow" id="pc-glow"></div>

        <div class="stage">
          <div class="product-wrap" id="pc-product">
            <img src="assets/product/elite200-cutout.png" alt="BLUETTI Elite 200 V2" />
          </div>

          <div class="copy-col">
            <div class="eyebrow" id="pc-eyebrow">BLUETTI</div>
            <div class="name" id="pc-name">Elite&nbsp;200&nbsp;V2</div>
            <div class="subtitle" id="pc-subtitle">Portable Power Station</div>

            <div class="stat-row">
              <div class="stat">
                <div class="stat-value-wrap">
                  <span class="stat-value" id="pc-stat-w">0</span
                  ><span class="stat-suffix" id="pc-suffix-w">W</span>
                </div>
                <div class="stat-label">AC Output</div>
              </div>
              <div class="stat-divider"></div>
              <div class="stat">
                <div class="stat-value-wrap">
                  <span class="stat-value" id="pc-stat-wh">0</span
                  ><span class="stat-suffix" id="pc-suffix-wh">Wh</span>
                </div>
                <div class="stat-label">Capacity</div>
              </div>
            </div>
          </div>
        </div>

        <div class="logo-mark" id="pc-logo">
          <img src="assets/brand/True_Gear_Logo_White.png" alt="True Gear" />
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const DUR = 11;

        // Scene self-fade in / out (dissolve against the shared navy bg — see house-style).
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
        tl.to("#root", { opacity: 0, duration: 0.4, ease: "power1.in" }, DUR - 0.4);

        // ── ambient-glow-bloom: blooms in landing on the product's settle (t ≈ 0.9) ──
        tl.fromTo(
          "#pc-glow",
          { opacity: 0, scale: 0.8 },
          { opacity: 0.3, scale: 1, duration: 0.9, ease: "power2.out" },
          0.3,
        );
        // bounded idle breathe while the card holds
        const glowPhase = { p: 0 };
        tl.to(
          glowPhase,
          {
            p: Math.PI * 2 * 2.5,
            duration: 6,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(glowPhase.p);
              document.getElementById("pc-glow").style.opacity = String(0.3 + s * 0.03);
            },
          },
          1.2,
        );

        // ── spring-pop-entrance: product settles smoothly, no overshoot ──
        tl.fromTo(
          "#pc-product",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.3,
        );

        // ── copy arrives ──
        tl.fromTo(
          "#pc-eyebrow",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.5,
        );
        tl.fromTo(
          "#pc-name",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          0.7,
        );
        tl.fromTo(
          "#pc-subtitle",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.95,
        );

        // ── hero spec chord: both stats count up together, same ease/duration ──
        const COUNT_START = 1.4;
        const COUNT_DUR = 1.8;

        const wState = { value: 0 };
        const wEl = document.getElementById("pc-stat-w");
        tl.to(
          wState,
          {
            value: 2600,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: () => {
              wEl.textContent = Math.round(wState.value).toLocaleString();
            },
          },
          COUNT_START,
        );
        tl.fromTo(
          "#pc-stat-w",
          { scale: 0.55 },
          { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
          COUNT_START,
        );

        const whState = { value: 0 };
        const whEl = document.getElementById("pc-stat-wh");
        tl.to(
          whState,
          {
            value: 2073.6,
            duration: COUNT_DUR,
            ease: "power3.out",
            onUpdate: () => {
              whEl.textContent = whState.value.toFixed(1);
            },
          },
          COUNT_START,
        );
        tl.fromTo(
          "#pc-stat-wh",
          { scale: 0.55 },
          { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
          COUNT_START,
        );

        tl.to(
          "#pc-suffix-w",
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
          COUNT_START + COUNT_DUR,
        );
        tl.to(
          "#pc-suffix-wh",
          { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
          COUNT_START + COUNT_DUR,
        );

        // ── brand mark, late and quiet ──
        tl.fromTo(
          "#pc-logo",
          { opacity: 0 },
          { opacity: 0.9, duration: 0.6, ease: "power1.out" },
          3.4,
        );

        window.__timelines["02-product-card"] = tl;
      </script>
    </template>
  </body>
</html>
