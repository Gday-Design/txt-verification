<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #011a27;
          overflow: hidden;
          opacity: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 36px;
        }

        .close-glow {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1050px;
          height: 1050px;
          transform: translate(-50%, -50%) scale(0.85);
          border-radius: 50%;
          background: radial-gradient(circle, rgba(240, 129, 15, 0.4) 0%, rgba(240, 129, 15, 0) 68%);
          opacity: 0;
          z-index: 1;
        }

        .close-logo {
          position: relative;
          z-index: 2;
          width: 620px;
          transform: scale(0);
          opacity: 0;
        }
        .close-logo img {
          width: 100%;
          height: auto;
          display: block;
        }

        .close-tagline {
          position: relative;
          z-index: 2;
          font-family: "JetBrains Mono", monospace;
          font-size: 30px;
          font-weight: 400;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #9f9c98;
          opacity: 0;
          transform: translateY(14px);
        }
      </style>

      <div id="root" data-composition-id="04-brand-close" data-width="1920" data-height="1080">
        <div class="close-glow" id="close-glow"></div>
        <div class="close-logo" id="close-logo">
          <img src="assets/brand/True_Gear_Logo_White.png" alt="True Gear" />
        </div>
        <div class="close-tagline" id="close-tagline">For The Good Life</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene self-fade in (no fade-out — final frame of the piece).
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

        // ambient-glow-bloom lands on the logo's settle
        tl.fromTo(
          "#close-glow",
          { opacity: 0, scale: 0.8 },
          { opacity: 0.28, scale: 1, duration: 0.9, ease: "power2.out" },
          0.3,
        );

        // logo settles — calm, restrained (no overshoot; "quiet close")
        tl.fromTo(
          "#close-logo",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.4,
        );

        // tagline, beat-late
        tl.fromTo(
          "#close-tagline",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          1.2,
        );

        window.__timelines["04-brand-close"] = tl;
      </script>
    </template>
  </body>
</html>
